name: spider_panel
description: Spider Panel - Professional Android client for Xray management
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Networking
  dio: ^5.4.3
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  
  # UI & Animation
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  glassmorphism: ^3.0.0
  backdropp_filter: ^0.3.0
  
  # Charts & Visualization
  fl_chart: ^0.68.0
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # SVG
  flutter_svg: ^2.0.10
  
  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/svg/
    - assets/images/
    - assets/lottie/
  
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: fonts/Vazirmatn-Regular.ttf
        - asset: fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: fonts/Vazirmatn-Bold.ttf
          weight: 700
